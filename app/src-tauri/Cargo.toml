[package]
name = "fm-app"
description = "Desktop app shell: Tauri 2 host for the Svelte UI, calling into fm-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Tauri convention: the app lives in a library so mobile targets can reuse it.
name = "fm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
fm-core = { path = "../../crates/fm-core" }
fm-netguard = { path = "../../crates/fm-netguard" }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.4", features = [] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[lints]
workspace = true
