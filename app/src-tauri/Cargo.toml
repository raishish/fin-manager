[package]
name = "fm-app"
description = "Desktop app shell: Tauri 2 host for the Svelte UI, calling into fm-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Tauri convention: the app lives in a library so mobile targets can reuse it.
name = "fm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
fm-core = { path = "../../crates/fm-core" }
fm-import-csv = { path = "../../crates/fm-import-csv" }
fm-llm = { path = "../../crates/fm-llm" }
fm-netguard = { path = "../../crates/fm-netguard" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
# The native folder picker for the backup folder (T5.5); only dialog:allow-open is granted.
tauri-plugin-dialog = "=2.8.3"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# The SimpleFIN tests run a real sync against a fake bridge on this machine (T5.13).
# Test builds only: fm-core refuses to compile it into an optimised build.
fm-core = { path = "../../crates/fm-core", features = ["fake-bridge"] }
sha2 = { version = "=0.11.1", default-features = false }
tempfile = "=3.27.0"
# Mock runtime for IPC tests; adds no dependencies.
tauri = { version = "=2.12.4", features = ["test"] }

[lints]
workspace = true
