[package]
name = "fm-synth"
description = "Deterministic synthetic ledger generator with ground truth (TD.1)."
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/raishish/fin-manager"
publish = false

# A standalone workspace: this crate is test-data tooling, kept out of the main
# workspace so the app's build never depends on it. Build and test it from this folder.
[workspace]

[dependencies]
fm-core = { path = "../../crates/fm-core" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
