name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests: one run per PR, and a new push supersedes the old run.
  # main: one group per commit, so every landed commit gets its own complete run.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Launch platforms (SPEC decision 11): Apple Silicon macOS and Linux.
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # v1: llama.cpp is built without CPU weight repacking (.cargo/config.toml). An
          # older cache would keep a build with it, so none from before is restored.
          prefix-key: v1-rust
      # The Tauri app (app/src-tauri) is a workspace member, so every Rust build needs the
      # built UI (tauri::generate_context! reads app/build) and, on Linux, Tauri's system
      # libraries. Node is pinned by app/.node-version (SPEC decision 35).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.node-version
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        # Known gap (SPEC decision 35): apt packages can't be pinned by hash.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Build the UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  app:
    # Type-check the Svelte UI.
    name: App (svelte-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.node-version
      - run: npm ci
      - run: npm run check
      # Unit tests of the UI's pure logic (node --test, no extra packages).
      - run: npm test

  synthetic-data:
    # The committed test ledgers must stay exactly what the generator produces, and the
    # generator must keep compiling against fm-core's model (TD.1).
    name: Test data (synthetic ledgers, bank exports, questions, import edge cases, transfer look-alikes)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo test --manifest-path testdata/synthetic/Cargo.toml --release --locked
      # The bank-export corpus (TD.2) is rendered from the synthetic ledgers; if those
      # change, re-render with `cargo run --release` in testdata/bank-exports.
      - run: cargo test --manifest-path testdata/bank-exports/Cargo.toml --release --locked
      # The question set (TD.3) is computed from TD.1's ledger and truth.
      - run: cargo test --manifest-path testdata/questions/Cargo.toml --release --locked
      # Adversarial import fixtures (TD.4): every file must parse to exactly its listed rows.
      - run: cargo test --manifest-path testdata/import-edge-cases/Cargo.toml --release --locked
      # Transfer look-alikes (TD.6), generated from a seed.
      - run: cargo test --manifest-path testdata/transfer-lookalikes/Cargo.toml --release --locked
      - run: cargo test --manifest-path testdata/holdout-questions/Cargo.toml --release --locked

  model-tests:
    # fm-llm against a real (tiny) model: SmolLM2-135M-Instruct Q8_0, pinned by SHA-256
    # (T2.3). Downloaded through fm-netguard with only the Hugging Face origins allowed
    # (SPEC decision 40), and cached by its hash. Both run on the CPU: the macOS runner's
    # GPU is a virtual one ("Apple Paravirtual device", Apple5 family, no simdgroup
    # reduction or matrix multiply), on which these tests took over 30 minutes (PR #17).
    name: Model tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      FM_LLM_TEST_MODEL: ${{ github.workspace }}/.models/SmolLM2-135M-Instruct-Q8_0.gguf
      FM_LLM_TEST_CPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # v1: llama.cpp is built without CPU weight repacking (.cargo/config.toml). An
          # older cache would keep a build with it, so none from before is restored.
          prefix-key: v1-rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: gguf-5a1395716f7913741cc51d98581b9b1228d80987a9f7d3664106742eb06bba83
      - name: Fetch the test model (verified by size and SHA-256)
        run: cargo run -p fm-llm --locked --example fetch_test_model -- .models
      # One test at a time: each one runs llama.cpp on every core, and side by side
      # they'd fight over the runner's 3–4 cores.
      - run: cargo test -p fm-llm --locked -- --test-threads 1
      # The app's Ask path on the same model (T4.5): host → worker → cached session →
      # question → query, through IPC. macOS only: it needs the built UI
      # (tauri::generate_context!), and on Linux Tauri's system libraries too, which the
      # Rust job already covers.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'macOS'
        with:
          node-version-file: app/.node-version
      - name: Build the UI (for the app's tests)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: The app's Ask path on the test model
        if: runner.os == 'macOS'
        run: cargo test -p fm-app --locked ask_model -- --test-threads 1
      # The model categoriser (T4.6): an import through IPC ends with the model's
      # decisions; nothing before the model is ready; a lock stops it mid-run.
      - name: The app's model categoriser on the test model
        if: runner.os == 'macOS'
        run: cargo test -p fm-app --locked categoriser -- --test-threads 1
      - name: llama.cpp is built without CPU weight repacking (SPEC decision 48)
        run: |
          caches=$(find target -path '*/build/llama-cpp-sys-2-*/out/build/CMakeCache.txt')
          if [ -z "$caches" ]; then
            echo "::error::no llama.cpp build under target/"
            exit 1
          fi
          for c in $caches; do
            grep -H '^GGML_CPU_REPACK:' "$c"
            if ! grep -q '^GGML_CPU_REPACK:BOOL=OFF$' "$c"; then
              echo "::error::llama.cpp was built with CPU weight repacking (see .cargo/config.toml)"
              exit 1
            fi
          done

  dco:
    # Contributions are accepted under a DCO sign-off (SPEC decision 24).
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit in the PR has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $c has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  cargo-deny:
    # Supply-chain checks (SPEC decision 35), configured in deny.toml:
    # licences, RustSec advisories, crate sources, and network crates allowed
    # only in fm-netguard (SPEC decision 21).
    name: cargo-deny
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: 0.20.2
      # SHA-256 of cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz; matches
      # the .sha256 published with the GitHub release.
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml; cargo-deny runs `cargo metadata`.
      - run: rustup show active-toolchain
      - name: Install cargo-deny (pinned release binary, checked by SHA-256)
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$RUNNER_TEMP/bin/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo deny --version
      - run: cargo deny --all-features --locked check
      # The synthetic test-data generator is its own workspace (testdata/synthetic).
      - run: cargo deny --manifest-path testdata/synthetic/Cargo.toml --all-features --locked check
      - run: cargo deny --manifest-path testdata/bank-exports/Cargo.toml --all-features --locked check
      - run: cargo deny --manifest-path testdata/questions/Cargo.toml --all-features --locked check
      - run: cargo deny --manifest-path testdata/import-edge-cases/Cargo.toml --all-features --locked check
      - run: cargo deny --manifest-path testdata/transfer-lookalikes/Cargo.toml --all-features --locked check
      - run: cargo deny --manifest-path testdata/holdout-questions/Cargo.toml --all-features --locked check
