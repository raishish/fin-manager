[package]
name = "fm-core"
description = "Ledger, storage, import pipeline, categorisation, views, queries and the output contract."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "functions", "hooks"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false }
zxcvbn = { version = "=3.1.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# Touch ID (T5.1): the Keychain item holding the data key's Touch ID copy.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.17.0", default-features = false, features = ["OSX_10_15"] }

[dev-dependencies]
tempfile = "=3.27.0"
