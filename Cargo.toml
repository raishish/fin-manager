[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/raishish/fin-manager"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
